title: Privacy Policy.
updated: |-
  Last updated:
  April 8, 2026
intro: At ARCMA, we are committed to protecting your privacy and safeguarding your personal information. This Privacy Policy explains what information we collect, how we use it, and what choices you have when using our website and services.
sections:
- heading: Information We Collect
  body: We collect personal information that you voluntarily provide through forms, bookings, or communication — such as your name, email address, and any information you choose to share when reaching out to us. In addition, we collect limited technical data (such as browser type and device information) to help us improve website functionality.
- heading: How We Use Your Information
  body: The information you provide allows us to communicate with you, respond to inquiries, and deliver services effectively. It may also be used to improve our website or send occasional updates if you’ve opted in.We do not sell or rent your information to third parties. We also do not use your data for advertising or behavioral targeting.
- heading: Data Storage & Security
  body: All personal data is stored using secure, encrypted systems and is accessible only to authorized team members. We implement industry-standard security measures to protect your information from unauthorized access, disclosure, or alteration.Despite our efforts, no online platform is entirely risk-free. If a data breach ever occurs, we will notify affected individuals as required by law.
- heading: Cookies
  body: |-
    We may use cookies (small data files) to understand how visitors interact with our website. This helps us improve your experience.
    You can choose to disable cookies in your browser settings at any time.
- heading: Your Rights
  body: You have the right to access, correct, or delete your personal information at any time. If you would like to review the data we’ve stored, or request its removal, you can contact us directly using the details below.You can also unsubscribe from our email communications at any time via the unsubscribe link or by reaching out to us.
- heading: Changes to This Policy
  body: This policy may be updated from time to time. When significant changes are made, we will update the date at the top of this page and, when appropriate, notify you by email or through the website.
contact:
  heading: Contact
  body: 'If you have any questions or concerns about this Privacy Policy, please contact us at: hello@arcma.co'
