- heading: External Links
  body: Our website may contain links to third-party websites or services. These links are provided for convenience and do not imply endorsement. We are not responsible for the content or practices of any external websites.
- heading: Disclaimer
  body: While we strive to provide accurate and helpful information, we make no guarantees about the completeness or reliability of the content. Use of the website is at your own risk. ClearPath is not liable for any damages arising from your use of the site.
- heading: Changes to These Terms
  body: We may update these Terms occasionally. When we do, we’ll update the “Last updated” date at the top of the page. Continued use of the site after changes means you accept the revised Terms.
