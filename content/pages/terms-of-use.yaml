intro: Welcome to ARCMA. These Terms of Use (“Terms”) define the rules, responsibilities, and expectations for visitors using this website. It establishes the legal framework for how content may be accessed, shared, or interacted with, while clarifying the rights of the website owner and the obligations of users. This page protects both the integrity of the site and the experience of its visitors, ensuring transparency, clarity, and mutual understanding.
sections:
- heading: Website Purpose
  body: The ARCMA website serves as the hub for our premium consultancy, offering transformational organizational insight and applied coherence practices to leaders and teams. Through case studies, frameworks, and resources, we illuminate how organizations can align culture, structure, and values to achieve sustainable performance. Designed to educate, inspire, and provide actionable tools, the site also introduces clients to our bespoke consulting services, helping them translate vision into operational reality while maintaining integrity, coherence, and signal across every layer of the organization.
- heading: Use of the Site
  body: You agree to use this website only for lawful purposes and in a way that does not infringe on the rights of others. You must not:Misuse the website by knowingly introducing harmful software or codeAttempt to gain unauthorized access to the site or its serversUse content from the website for commercial purposes without permission
